env: local
service_name: cri-svc-security-server
port: "18230"
log_level: debug
base_host: ""

# Security-server de BCR. Corre en :18230 y enruta requests del binario
# de bcr (que escucha en :18304/_interop/dispatch... pero como BCR no expone
# servicios al fabric, el dispatch_url no se invoca en práctica).
member:
  realm: demo
  slug: bcr
  private_pem_path: ./.keys/bcr.pem
  member_dispatch_url: http://localhost:18304/_interop/dispatch

hub:
  url: http://localhost:18101
  cache_ttl: 5m

audit:
  url: http://localhost:18102

peers:
  - member: registro-civil
    inbox_url: http://localhost:18210/v1/interop/inbox
    public_key_path: ./.keys/registro-civil.pub.pem
  - member: hacienda
    inbox_url: http://localhost:18200/v1/interop/inbox
    public_key_path: ./.keys/hacienda.pub.pem
  - member: ccss
    inbox_url: http://localhost:18220/v1/interop/inbox
    public_key_path: ./.keys/ccss.pub.pem
  - member: bcr
    inbox_url: http://localhost:18230/v1/interop/inbox
    public_key_path: ./.keys/bcr.pub.pem

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

call_timeout: 5s
