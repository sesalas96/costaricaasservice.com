env: local
service_name: cri-svc-interop-hub
port: "18101"
log_level: debug
base_host: ""

database:
  url: postgres://postgres:postgres@localhost:5432/cri_interop_hub?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
