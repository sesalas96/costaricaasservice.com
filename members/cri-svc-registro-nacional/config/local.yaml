env: local
service_name: cri-svc-registro-nacional
port: "18311"
log_level: debug
base_host: ""

# Registro Nacional habla con su SS local en :18320 cuando consume servicios
# de otros members (ej. registro-civil para nombre del propietario).
security_server: http://localhost:18320

database:
  url: postgres://postgres:postgres@localhost:5432/cri_registro_nacional?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
