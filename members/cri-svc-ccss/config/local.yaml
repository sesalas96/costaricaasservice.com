env: local
service_name: cri-svc-ccss
port: "18303"
log_level: debug
base_host: ""

# CCSS habla con su SS local (puerto 18220) cuando necesita consumir
# servicios de otros members (registro-civil, etc).
security_server: http://localhost:18220

database:
  url: postgres://postgres:postgres@localhost:5432/cri_ccss?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
