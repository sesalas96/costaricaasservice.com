env: local
service_name: cri-svc-minsa
port: "18309"
log_level: debug
base_host: ""

# MINSA habla con su SS local en :18270 cuando consume servicios de otros
# members (ej. registro-civil para nombre del profesional o titular).
security_server: http://localhost:18270

database:
  url: postgres://postgres:postgres@localhost:5432/cri_minsa?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
