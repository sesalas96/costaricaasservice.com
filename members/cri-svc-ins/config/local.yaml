env: local
service_name: cri-svc-ins
port: "18305"
log_level: debug
base_host: ""

# INS habla con su SS local en :18240 cuando consume servicios de otros
# members (ej. registro-civil para nombre/domicilio del titular).
security_server: http://localhost:18240

database:
  url: postgres://postgres:postgres@localhost:5432/cri_ins?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
