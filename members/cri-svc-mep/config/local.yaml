env: local
service_name: cri-svc-mep
port: "18306"
log_level: debug
base_host: ""

# MEP habla con su SS local en :18250 cuando consume servicios de otros
# members (ej. registro-civil para nombre del estudiante o tutor).
security_server: http://localhost:18250

database:
  url: postgres://postgres:postgres@localhost:5432/cri_mep?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
