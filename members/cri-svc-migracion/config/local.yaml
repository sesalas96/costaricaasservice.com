env: local
service_name: cri-svc-migracion
port: "18310"
log_level: debug
base_host: ""

# Migración habla con su SS local en :18260 cuando consume servicios de otros
# members (ej. registro-civil para nombre del residente).
security_server: http://localhost:18260

database:
  url: postgres://postgres:postgres@localhost:5432/cri_migracion?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
