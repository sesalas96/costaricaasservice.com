env: local
service_name: cri-templates-service
port: "TEMPLATE_PORT"
log_level: debug

database:
  url: postgres://postgres:postgres@localhost:5432/cri_templates?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s
