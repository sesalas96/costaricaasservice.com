env: local
service_name: cri-svc-iduc-identity
port: "18081" # 8081 está ocupado por cbn — costaricaasservice usa 18000-18999 en local
log_level: debug
base_host: "" # vacío en servicios internos — confiar en el header X-CRI-Realm

database:
  url: postgres://postgres:postgres@localhost:5432/cri_iduc_identity?sslmode=disable
  max_conns: 10
  min_conns: 2

server:
  read_timeout: 10s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 15s

token:
  private_pem_path: ./.keys/jwt-rs256.pem
  issuer: cri-svc-iduc-identity
  access_ttl: 15m
  refresh_ttl: 720h
  key_id: dev-2026-05
